[project]
name = "previsao-do-tempo-open-meteo"
version = "0.1.0"
description = "Pipeline de dados climáticos D-1 dos municípios do Brasil: Open-Meteo API → S3 → Databricks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pandas>=2.2,<3",
    "pyarrow>=21.0",
    "python-dateutil>=2.9",
    "requests>=2.32",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
